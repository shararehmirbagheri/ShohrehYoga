name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build with Buildozer
        run: |
          docker run --rm \
            --entrypoint bash \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            kivy/buildozer:latest \
            -c "yes | buildozer -v android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shohreh-yoga-apk
          path: bin/*.apk
          if-no-files-found: ignore
