name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            --entrypoint bash \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            kivy/buildozer:latest \
            -c "
              cd /home/user/hostcwd
              # Force stable branch
              sed -i 's/^p4a.branch.*/p4a.branch = master/' buildozer.spec || echo 'p4a.branch = master' >> buildozer.spec
              yes | buildozer -v android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shohreh-yoga-apk
          path: bin/*.apk
          if-no-files-found: ignore
